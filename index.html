<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --text: #111827;
      --muted: #6b7280;
      --error: #dc2626;

      --group-bg: #ffffff;
      --group-border: #d1d5db;
      --group-divider: #e5e7eb;
      --focus-border: #3b82f6;
      --focus-ring: rgba(59, 130, 246, 0.18);

      --input-text: #111827;
      --placeholder: #9ca3af;

      --icon: #4b5563;
      --icon-hover-bg: rgba(17, 24, 39, 0.06);
      --icon-active-bg: rgba(17, 24, 39, 0.11);
    }
    html.dark {
      --text: #f3f4f6;
      --muted: #9ca3af;
      --error: #f87171;

      --group-bg: #1f2937;
      --group-border: #374151;
      --group-divider: #374151;
      --focus-border: #60a5fa;
      --focus-ring: rgba(96, 165, 250, 0.25);

      --input-text: #f3f4f6;
      --placeholder: #6b7280;

      --icon: #9ca3af;
      --icon-hover-bg: rgba(255, 255, 255, 0.08);
      --icon-active-bg: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
    }
    body {
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .error { color: var(--error); margin-top: 8px; font-size: 14px; }
    .input-group {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--group-border);
      border-radius: 8px;
      background: var(--group-bg);
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input-group:focus-within {
      border-color: var(--focus-border);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .cmd-input {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 10px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--input-text);
      background: transparent;
      border: 0;
      outline: none;
      cursor: text;
    }
    .cmd-input::placeholder { color: var(--placeholder); }
    .copy-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      color: var(--icon);
      background: transparent;
      border: 0;
      border-left: 1px solid var(--group-divider);
      border-radius: 0;
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }
    .copy-btn:hover { color: var(--text); background: var(--icon-hover-bg); }
    .copy-btn:active { background: var(--icon-active-bg); }
    .copy-btn:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: -2px;
    }
    .copy-btn svg { display: block; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .runtime { color: var(--muted); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div v-if="error" class="error">{{ error }}</div>
    <div v-else>
      <div class="input-group">
        <input
          class="cmd-input"
          type="text"
          v-model="shellCommand"
          placeholder="ADB Address"
          readonly>
        <button
          class="copy-btn"
          type="button"
          @click="copyCommand"
          title="复制"
          aria-label="复制">
          <!-- Icons are inlined from lucide (copy / check / x) to keep the plugin dependency-free. -->
          <svg
            v-if="copyState === 'idle'"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
          </svg>
          <svg
            v-else-if="copyState === 'success'"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
          <svg
            v-else
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
      <span class="sr-only" role="status" aria-live="polite">{{ copyStatus }}</span>
      <div class="runtime">在线时长: {{ formattedRuntime }}</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script>
    new Vue({
      el: "#app",
      data: {
        adbAddress: "",
        error: "",
        copyState: "idle",
        copyTimer: null,
        refreshInterval: null,
        startTime: Date.now(),
        currentTime: Date.now()
      },
      methods: {
        async connectDevice() {
          try {
            await this._connectDevice();
          } catch (err) {
            this.error = `Error: ${err.message}`;
            this.adbAddress = "";
          }
        },
        async _connectDevice() {
          // Parse URL path to extract device ID
          // URL format: http://localhost:33299/plugin/helloworld/index.html?deviceId=a-08a3d291&id=1
          const urlParams = new URLSearchParams(window.location.search);
          const deviceId = urlParams.get('deviceId');

          if (!deviceId) {
            this.error = "No device ID found in URL";
            return;
          }

          // Build API URL
          const apiUrl = `${location.protocol}//${location.host}/api/v1/devices/${deviceId}/connect`;

          // Make API call
          const response = await fetch(apiUrl);
          const result = await response.json();

          if (result.code === 0 && result.data && result.data.endpoint) {
            this.adbAddress = result.data.endpoint;
          } else {
            this.error = result.message || "Failed to connect to device";
            this.adbAddress = "";
          }
        },
        async copyCommand() {
          const text = this.shellCommand;
          if (!text) return;
          const copied = await this.copyText(text);
          this.setCopyState(copied ? "success" : "error");
        },
        async copyText(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(text);
              return true;
            } catch (err) {
              // Fall back to execCommand below.
            }
          }
          try {
            const input = document.querySelector('.cmd-input');
            if (!input) return false;
            input.select();
            return document.execCommand('copy');
          } catch (err) {
            return false;
          }
        },
        setCopyState(state) {
          if (this.copyTimer) {
            clearTimeout(this.copyTimer);
          }
          this.copyState = state;
          this.copyTimer = setTimeout(() => {
            this.copyState = "idle";
            this.copyTimer = null;
          }, 1500);
        }
      },
      computed: {
        shellCommand() {
          return this.adbAddress ? `adb connect ${this.adbAddress}` : "";
        },
        copyStatus() {
          if (this.copyState === "success") return "已复制";
          if (this.copyState === "error") return "复制失败";
          return "";
        },
        formattedRuntime() {
          if (!this.startTime) return "00:00:00";

          const elapsed = Math.round((this.currentTime - this.startTime) / 1000);
          const hours = Math.floor(elapsed / 3600);
          const minutes = Math.floor((elapsed % 3600) / 60);
          const seconds = elapsed % 60;

          return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
      },
      mounted() {
        this.startTime = Date.now();

        this.connectDevice();

        // Set up interval to refresh connection every 10 minutes
        this.refreshInterval = setInterval(() => {
          this.connectDevice();
        }, 10 * 60 * 1000); // 10 minutes in milliseconds

        // Update runtime display every second
        this.timeInterval = setInterval(() => {
          this.currentTime = Date.now();
        }, 1000);
      },
      beforeDestroy() {
        // Clear intervals when component is destroyed
        if (this.refreshInterval) {
          clearInterval(this.refreshInterval);
        }
        if (this.timeInterval) {
          clearInterval(this.timeInterval);
        }
        if (this.copyTimer) {
          clearTimeout(this.copyTimer);
        }
      }
    })
  </script>
</body>

</html>
