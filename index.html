<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --text: #111827;
      --muted: #6b7280;
      --input-bg: transparent;
      --input-border: #d1d5db;
      --input-text: #111827;
      --placeholder: #9ca3af;
      --error: #ef4444;
      --copy-accent: #111827;
      --copy-fg: #ffffff;
    }
    html.dark {
      --text: #f9fafb;
      --muted: #9ca3af;
      --input-bg: transparent;
      --input-border: #4b5563;
      --input-text: #f9fafb;
      --placeholder: #6b7280;
      --error: #f87171;
      --copy-accent: #f9fafb;
      --copy-fg: #111827;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
    }
    body {
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .error { color: var(--error); margin-top: 8px; font-size: 14px; }
    .cmd-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .cmd-input {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--input-text);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      cursor: text;
    }
    .cmd-input::placeholder { color: var(--placeholder); }
    .cmd-input:focus { border-color: #3b82f6; }
    .copy-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      color: var(--copy-fg);
      background: var(--copy-accent);
      border: 1px solid var(--copy-accent);
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .copy-btn:hover { opacity: 0.85; }
    .copy-btn:active { opacity: 0.7; }
    .copy-btn svg { display: block; }
    .copy-icon { font-size: 15px; line-height: 1; }
    .runtime { color: var(--muted); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div v-if="error" class="error">{{ error }}</div>
    <div v-else>
      <div class="cmd-row">
        <input
          class="cmd-input"
          type="text"
          v-model="shellCommand"
          placeholder="ADB Address"
          readonly>
        <button
          class="copy-btn"
          type="button"
          @click="copyCommand"
          title="复制"
          aria-label="复制">
          <svg
            v-if="copyState === 'idle'"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span v-else-if="copyState === 'success'" class="copy-icon" aria-hidden="true">✅</span>
          <span v-else class="copy-icon" aria-hidden="true">❌</span>
        </button>
      </div>
      <div class="runtime">在线时长: {{ formattedRuntime }}</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script>
    new Vue({
      el: "#app",
      data: {
        adbAddress: "",
        error: "",
        copyState: "idle",
        copyTimer: null,
        refreshInterval: null,
        startTime: Date.now(),
        currentTime: Date.now()
      },
      methods: {
        async connectDevice() {
          try {
            await this._connectDevice();
          } catch (err) {
            this.error = `Error: ${err.message}`;
            this.adbAddress = "";
          }
        },
        async _connectDevice() {
          // Parse URL path to extract device ID
          // URL format: http://localhost:33299/plugin/helloworld/index.html?deviceId=a-08a3d291&id=1
          const urlParams = new URLSearchParams(window.location.search);
          const deviceId = urlParams.get('deviceId');

          if (!deviceId) {
            this.error = "No device ID found in URL";
            return;
          }

          // Build API URL
          const apiUrl = `${location.protocol}//${location.host}/api/v1/devices/${deviceId}/connect`;

          // Make API call
          const response = await fetch(apiUrl);
          const result = await response.json();

          if (result.code === 0 && result.data && result.data.endpoint) {
            this.adbAddress = result.data.endpoint;
          } else {
            this.error = result.message || "Failed to connect to device";
            this.adbAddress = "";
          }
        },
        async copyCommand() {
          const text = this.shellCommand;
          if (!text) return;
          const copied = await this.copyText(text);
          this.setCopyState(copied ? "success" : "error");
        },
        async copyText(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(text);
              return true;
            } catch (err) {
              // Fall back to execCommand below.
            }
          }
          try {
            const input = document.querySelector('.cmd-input');
            if (!input) return false;
            input.select();
            return document.execCommand('copy');
          } catch (err) {
            return false;
          }
        },
        setCopyState(state) {
          if (this.copyTimer) {
            clearTimeout(this.copyTimer);
          }
          this.copyState = state;
          this.copyTimer = setTimeout(() => {
            this.copyState = "idle";
            this.copyTimer = null;
          }, 1500);
        }
      },
      computed: {
        shellCommand() {
          return this.adbAddress ? `adb connect ${this.adbAddress}` : "";
        },
        formattedRuntime() {
          if (!this.startTime) return "00:00:00";

          const elapsed = Math.round((this.currentTime - this.startTime) / 1000);
          const hours = Math.floor(elapsed / 3600);
          const minutes = Math.floor((elapsed % 3600) / 60);
          const seconds = elapsed % 60;

          return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
      },
      mounted() {
        this.startTime = Date.now();

        this.connectDevice();

        // Set up interval to refresh connection every 10 minutes
        this.refreshInterval = setInterval(() => {
          this.connectDevice();
        }, 10 * 60 * 1000); // 10 minutes in milliseconds

        // Update runtime display every second
        this.timeInterval = setInterval(() => {
          this.currentTime = Date.now();
        }, 1000);
      },
      beforeDestroy() {
        // Clear intervals when component is destroyed
        if (this.refreshInterval) {
          clearInterval(this.refreshInterval);
        }
        if (this.timeInterval) {
          clearInterval(this.timeInterval);
        }
        if (this.copyTimer) {
          clearTimeout(this.copyTimer);
        }
      }
    })
  </script>
</body>

</html>
